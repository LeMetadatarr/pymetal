[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymetal"
dynamic = ["version"]
description = "metal-archives.com Python client with a relational data model"
readme = "readme.md"
license = { text = "Apache-2.0" }
authors = [{ name = "jarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.10"
dependencies = [
    "curl_cffi",
    "lxml",
    "pydantic>=2",
    "random-user-agent",
]

[project.optional-dependencies]
antibot = ["unblock_requests"]
test = ["pytest", "pytest-cov", "unblock_requests"]
harvest = ["harvestkit>=0.1.0a1", "unblock_requests"]

[project.scripts]
pymetal-harvest = "pymetal.harvest:main"

[project.urls]
Homepage = "https://github.com/LeMetadatarr/pymetal"
Source = "https://github.com/LeMetadatarr/pymetal"

[tool.setuptools.packages.find]
exclude = ["test*", "examples*"]

[tool.setuptools.dynamic]
version = { attr = "pymetal.version.__version__" }
